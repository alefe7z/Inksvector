name: Import Inkscape source

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-inkscape-source.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Import upstream source and preserve Inksvector changes
        shell: bash
        env:
          UPSTREAM_COMMIT: 82ace79ad91b0af7e8fc4b93e194c64a5f17fd67
        run: |
          set -euo pipefail
          if git cat-file -e HEAD:CMakeLists.txt 2>/dev/null; then
            echo 'The full source is already present.'
            exit 0
          fi
          inksvector_head=$(git rev-parse HEAD)
          git fetch --depth=1 https://gitlab.com/inkscape/inkscape.git "$UPSTREAM_COMMIT"
          git read-tree --reset -u "$UPSTREAM_COMMIT"
          git ls-tree -r -z --name-only "$inksvector_head" |
            git --literal-pathspecs restore --source="$inksvector_head" --staged --worktree --pathspec-from-file=- --pathspec-file-nul
          git diff --cached --name-status --diff-filter=DM "$inksvector_head" --exit-code
          test -f CMakeLists.txt
          test -f COPYING
          test "$(git ls-files --stage | awk '$1 == 160000 {n++} END {print n}')" -eq 8
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit \
            -m "Import complete Inkscape 1.5-dev source" \
            -m "Upstream: https://gitlab.com/inkscape/inkscape/-/commit/$UPSTREAM_COMMIT"
          git push origin HEAD:refs/heads/main
