name: Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 220
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Prepare source and dependencies
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth=1 --jobs 4
          bash buildtools/msys2installdeps.sh

      - name: Compile and package the NSIS installer
        run: |
          set -euo pipefail
          [[ "$(gcc -dumpmachine)" == x86_64-w64-mingw32 ]]
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD/stage")"
          cmake --build build --target dist-win-exe --parallel 2
          shopt -s nullglob
          installers=(build/inkscape-*.exe)
          [[ "${#installers[@]}" -eq 1 && -s "${installers[0]}" ]]
          mkdir -p dist
          cp "${installers[0]}" dist/
          (cd dist && sha256sum -- *.exe > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: inksvector-windows-x64
          path: dist/
          if-no-files-found: error
